name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ${{ github.workspace }}/data/sample.duckdb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -v

      - name: Build sample DuckDB (synthetic raw data)
        run: python -m scripts.create_sample_db

      - name: dbt build (models + tests)
        working-directory: dbt/retail_analytics
        env:
          DBT_PROFILES_DIR: .
        run: dbt build
