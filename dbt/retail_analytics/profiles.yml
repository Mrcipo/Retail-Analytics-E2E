retail_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relativo a dbt/retail_analytics (desde donde se corre dbt). Se puede
      # sobrescribir con una ruta absoluta en DUCKDB_PATH.
      path: "{{ env_var('DUCKDB_PATH', '../../data/retail_analytics.duckdb') }}"
      threads: 4
